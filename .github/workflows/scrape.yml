name: Scrape books catalogue

on:
  # Ручной запуск кнопкой "Run workflow" на вкладке Actions
  workflow_dispatch:
  # Автоматический запуск каждый день в 06:00 UTC (11:00 по Алматы)
  schedule:
    - cron: "0 6 * * *"

# Нужно, чтобы workflow мог сам закоммитить результат обратно в репозиторий
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        run: python parser.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.csv data/books.xlsx
          git diff --staged --quiet && echo "Нет изменений" || git commit -m "Обновление данных: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
